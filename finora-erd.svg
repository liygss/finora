<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#475569"/></marker><style>.t{font:700 28px Arial;fill:#0f172a}.s{font:400 14px Arial;fill:#475569}.g{font:700 17px Arial;fill:#fff}.h{font:700 15px Arial;fill:#0f172a}.c{font:400 12px Arial;fill:#334155}.r{font:600 11px Arial;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.pk{fill:#dbeafe}.fk{fill:#fef3c7}</style></defs>
<rect width="1800" height="1250" fill="#f8fafc"/><text x="900" y="42" text-anchor="middle" class="t">ERD Database Finora</text><text x="900" y="68" text-anchor="middle" class="s">Entity Relationship Diagram — PostgreSQL relational schema</text>
<rect x="35" y="95" width="1730" height="1080" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><rect x="35" y="95" width="1730" height="45" rx="18" fill="#2563eb"/><text x="900" y="125" text-anchor="middle" class="g">FINORA DATABASE</text>
<!-- users --> <g><rect x="75" y="185" width="260" height="190" rx="10" class="box"/><rect x="75" y="185" width="260" height="35" rx="10" fill="#1d4ed8"/><text x="205" y="208" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">users</text><rect x="86" y="232" width="238" height="25" class="pk"/><text x="96" y="249" class="c">PK id VARCHAR(36)</text><text x="96" y="274" class="c">email VARCHAR(255) UNIQUE</text><text x="96" y="296" class="c">full_name, role, plan</text><text x="96" y="318" class="c">company_name, is_active</text><text x="96" y="340" class="c">created_at, updated_at</text><text x="96" y="362" class="c">verification/reset tokens</text></g>
<!-- akun --> <g><rect x="75" y="450" width="260" height="180" rx="10" class="box"/><rect x="75" y="450" width="260" height="35" rx="10" fill="#1d4ed8"/><text x="205" y="473" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">akun</text><rect x="86" y="497" width="238" height="25" class="pk"/><text x="96" y="514" class="c">PK id VARCHAR(36)</text><text x="96" y="539" class="c">kode_akun UNIQUE</text><text x="96" y="561" class="c">nama_akun, kategori</text><text x="96" y="583" class="c">saldo_normal, sub_kategori</text><text x="96" y="605" class="c">is_active, deskripsi</text></g>
<!-- jurnal umum --> <g><rect x="420" y="185" width="285" height="205" rx="10" class="box"/><rect x="420" y="185" width="285" height="35" rx="10" fill="#16a34a"/><text x="562" y="208" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">jurnal_umum</text><rect x="432" y="232" width="261" height="25" class="pk"/><text x="442" y="249" class="c">PK id VARCHAR(36)</text><text x="442" y="274" class="c">no_bukti UNIQUE, tanggal</text><text x="442" y="296" class="c">deskripsi, jenis, is_locked</text><rect x="432" y="305" width="261" height="25" class="fk"/><text x="442" y="322" class="c">FK sumber_upload_id</text><rect x="432" y="331" width="261" height="25" class="fk"/><text x="442" y="348" class="c">FK created_by_id → users</text><text x="442" y="374" class="c">created_at</text></g>
<!-- detail --> <g><rect x="420" y="480" width="285" height="185" rx="10" class="box"/><rect x="420" y="480" width="285" height="35" rx="10" fill="#16a34a"/><text x="562" y="503" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">jurnal_detail</text><rect x="432" y="527" width="261" height="25" class="pk"/><text x="442" y="544" class="c">PK id VARCHAR(36)</text><rect x="432" y="553" width="261" height="25" class="fk"/><text x="442" y="570" class="c">FK jurnal_id → jurnal_umum</text><rect x="432" y="579" width="261" height="25" class="fk"/><text x="442" y="596" class="c">FK akun_id → akun</text><text x="442" y="622" class="c">urutan, debit, kredit</text><text x="442" y="644" class="c">keterangan</text></g>
<!-- uploaded --> <g><rect x="790" y="185" width="285" height="205" rx="10" class="box"/><rect x="790" y="185" width="285" height="35" rx="10" fill="#ea580c"/><text x="932" y="208" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">uploaded_files</text><rect x="802" y="232" width="261" height="25" class="pk"/><text x="812" y="249" class="c">PK id VARCHAR(36)</text><text x="812" y="274" class="c">original_filename, stored_path</text><text x="812" y="296" class="c">file_bytes, file_type, size</text><text x="812" y="318" class="c">status, error_message, context</text><rect x="802" y="331" width="261" height="25" class="fk"/><text x="812" y="348" class="c">FK uploaded_by_id → users</text><text x="812" y="374" class="c">created_at, processed_at</text></g>
<!-- chunks --> <g><rect x="790" y="480" width="285" height="180" rx="10" class="box"/><rect x="790" y="480" width="285" height="35" rx="10" fill="#ea580c"/><text x="932" y="503" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">document_chunks</text><rect x="802" y="527" width="261" height="25" class="pk"/><text x="812" y="544" class="c">PK id VARCHAR(36)</text><rect x="802" y="553" width="261" height="25" class="fk"/><text x="812" y="570" class="c">FK source_file_id</text><text x="812" y="596" class="c">chunk_index, content</text><text x="812" y="618" class="c">qdrant_point_id, token_count</text><text x="812" y="640" class="c">extra_metadata, created_at</text></g>
<!-- chat --> <g><rect x="1160" y="185" width="275" height="165" rx="10" class="box"/><rect x="1160" y="185" width="275" height="35" rx="10" fill="#7c3aed"/><text x="1297" y="208" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">chat_sessions</text><rect x="1172" y="232" width="251" height="25" class="pk"/><text x="1182" y="249" class="c">PK id VARCHAR(36)</text><rect x="1172" y="258" width="251" height="25" class="fk"/><text x="1182" y="275" class="c">FK user_id → users</text><text x="1182" y="301" class="c">title, created_at</text><text x="1182" y="323" class="c">updated_at</text></g>
<g><rect x="1160" y="425" width="275" height="165" rx="10" class="box"/><rect x="1160" y="425" width="275" height="35" rx="10" fill="#7c3aed"/><text x="1297" y="448" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">chat_messages</text><rect x="1172" y="472" width="251" height="25" class="pk"/><text x="1182" y="489" class="c">PK id VARCHAR(36)</text><rect x="1172" y="498" width="251" height="25" class="fk"/><text x="1182" y="515" class="c">FK session_id</text><text x="1182" y="541" class="c">role, content</text><text x="1182" y="563" class="c">retrieved_chunk_ids</text></g>
<!-- spt --> <g><rect x="1160" y="665" width="275" height="170" rx="10" class="box"/><rect x="1160" y="665" width="275" height="35" rx="10" fill="#7c3aed"/><text x="1297" y="688" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">spt_tahunan</text><rect x="1172" y="712" width="251" height="25" class="pk"/><text x="1182" y="729" class="c">PK id VARCHAR(36)</text><rect x="1172" y="738" width="251" height="25" class="fk"/><text x="1182" y="755" class="c">FK user_id → users</text><text x="1182" y="781" class="c">form_type, tahun_pajak</text><text x="1182" y="803" class="c">status, data JSON</text><text x="1182" y="825" class="c">created_at, updated_at</text></g>
<!-- support --> <g><rect x="1480" y="185" width="245" height="170" rx="10" class="box"/><rect x="1480" y="185" width="245" height="35" rx="10" fill="#be123c"/><text x="1602" y="208" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">notifications</text><rect x="1492" y="232" width="221" height="25" class="pk"/><text x="1502" y="249" class="c">PK id</text><text x="1502" y="274" class="c">FK user_id, sender_id</text><text x="1502" y="300" class="c">type, title, message</text><text x="1502" y="326" class="c">is_read, created_at</text></g>
<g><rect x="1480" y="425" width="245" height="190" rx="10" class="box"/><rect x="1480" y="425" width="245" height="35" rx="10" fill="#be123c"/><text x="1602" y="448" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">feedback</text><rect x="1492" y="472" width="221" height="25" class="pk"/><text x="1502" y="489" class="c">PK id</text><text x="1502" y="514" class="c">FK user_id, replied_by_id</text><text x="1502" y="540" class="c">category, subject, message</text><text x="1502" y="566" class="c">status, admin_reply</text><text x="1502" y="592" class="c">created_at, updated_at</text></g>
<g><rect x="1480" y="700" width="245" height="145" rx="10" class="box"/><rect x="1480" y="700" width="245" height="35" rx="10" fill="#be123c"/><text x="1602" y="723" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">exit_feedback</text><rect x="1492" y="747" width="221" height="25" class="pk"/><text x="1502" y="764" class="c">PK id</text><text x="1502" y="790" class="c">FK user_id → users</text><text x="1502" y="816" class="c">rating, comment</text><text x="1502" y="838" class="c">created_at</text></g>
<!-- tutup --> <g><rect x="790" y="735" width="285" height="165" rx="10" class="box"/><rect x="790" y="735" width="285" height="35" rx="10" fill="#16a34a"/><text x="932" y="758" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">tutup_buku</text><rect x="802" y="782" width="261" height="25" class="pk"/><text x="812" y="799" class="c">PK id</text><rect x="802" y="808" width="261" height="25" class="fk"/><text x="812" y="825" class="c">FK user_id, jurnal IDs</text><text x="812" y="851" class="c">tahun, tanggal_tutup</text><text x="812" y="873" class="c">laba_bersih, no_bukti</text></g>
<!-- relations -->
<path d="M335 275L420 275" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="350" y="264" class="r">1:N</text>
