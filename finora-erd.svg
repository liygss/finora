<path d="M335 525L420 570" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="350" y="540" class="r">1:N</text>
<path d="M562 390L562 480" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="575" y="440" class="r">1:N</text>
<path d="M705 330L790 330" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="720" y="320" class="r">1:N</text>
<path d="M932 390L932 480" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="945" y="440" class="r">1:N</text>
<path d="M1297 350L1297 425" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="1310" y="390" class="r">1:N</text>
<path d="M335 350L1160 700" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="700" y="505" class="r">1:N</text>
<path d="M335 215L1480 265" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/>
<path d="M335 245L1480 500" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/>
<path d="M335 350L1480 770" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/>
<path d="M705 360L790 810" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/>
<rect x="70" y="1095" width="500" height="45" rx="8" fill="#dbeafe"/><text x="90" y="1123" class="c">Biru: PK/identitas utama</text><rect x="600" y="1095" width="500" height="45" rx="8" fill="#fef3c7"/><text x="620" y="1123" class="c">Kuning: FK/relasi ke tabel lain</text><rect x="1130" y="1095" width="550" height="45" rx="8" fill="#f1f5f9"/><text x="1150" y="1123" class="c">Garis putus-putus: relasi tambahan ke users/jurnal</text>
</svg>