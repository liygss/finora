<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.2"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .section { font: 700 21px Arial, sans-serif; fill: #ffffff; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .arrow-label { font: 600 13px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="800" y="48" text-anchor="middle" class="title">Arsitektur Aplikasi Finora</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">Perbandingan arsitektur web dan desktop berbasis React, FastAPI, Electron, database, dan layanan AI</text>

  <rect x="55" y="105" width="720" height="790" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="105" width="720" height="58" rx="18" fill="#2563eb"/>
  <rect x="55" y="145" width="720" height="18" fill="#2563eb"/>
  <text x="415" y="142" text-anchor="middle" class="section">ARSITEKTUR WEB</text>

  <rect x="105" y="200" width="620" height="105" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="415" y="232" text-anchor="middle" class="box-title">Pengguna / Browser</text>
  <text x="415" y="258" text-anchor="middle" class="box-text">Aplikasi React + Vite</text>
  <text x="415" y="281" text-anchor="middle" class="small">Dashboard, accounting, pajak, SPT, upload, chatbot</text>

  <rect x="105" y="370" width="620" height="125" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="415" y="402" text-anchor="middle" class="box-title">Web Server / API</text>
  <text x="415" y="428" text-anchor="middle" class="box-text">Backend Python + FastAPI + Uvicorn</text>
  <text x="415" y="451" text-anchor="middle" class="small">Autentikasi, accounting, laporan, pajak, SPT, upload, chatbot</text>
  <text x="415" y="474" text-anchor="middle" class="small">REST API dan validasi data</text>

  <rect x="105" y="560" width="285" height="130" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="247" y="592" text-anchor="middle" class="box-title">Database Relasional</text>
  <text x="247" y="620" text-anchor="middle" class="box-text">SQLite / PostgreSQL</text>
  <text x="247" y="645" text-anchor="middle" class="small">User, akun, jurnal, SPT</text>
  <text x="247" y="666" text-anchor="middle" class="small">feedback, notifikasi</text>

  <rect x="440" y="560" width="285" height="130" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="582" y="592" text-anchor="middle" class="box-title">AI dan Knowledge Base</text>
  <text x="582" y="620" text-anchor="middle" class="box-text">Qdrant + FastEmbed</text>
  <text x="582" y="645" text-anchor="middle" class="small">RAG, pencarian dokumen</text>
  <text x="582" y="666" text-anchor="middle" class="small">Ollama sebagai LLM</text>

  <rect x="105" y="755" width="620" height="90" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="415" y="787" text-anchor="middle" class="box-title">Deployment Web</text>
  <text x="415" y="814" text-anchor="middle" class="box-text">Docker / Vercel / server cloud</text>
  <text x="415" y="835" text-anchor="middle" class="small">Frontend dan backend dapat dideploy terpisah</text>

  <path d="M415 305 L415 370" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="430" y="343" class="arrow-label">HTTP / HTTPS</text>
  <path d="M350 495 L247 560" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M480 495 L582 560" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="370" y="536" class="arrow-label">SQLAlchemy</text>
  <text x="535" y="536" class="arrow-label">RAG pipeline</text>
  <path d="M415 690 L415 755" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="825" y="105" width="720" height="790" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="825" y="105" width="720" height="58" rx="18" fill="#16a34a"/>
  <rect x="825" y="145" width="720" height="18" fill="#16a34a"/>
  <text x="1185" y="142" text-anchor="middle" class="section">ARSITEKTUR DESKTOP</text>

  <rect x="875" y="200" width="620" height="105" rx="12" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="1185" y="232" text-anchor="middle" class="box-title">Pengguna / Aplikasi Desktop</text>
  <text x="1185" y="258" text-anchor="middle" class="box-text">Electron + React frontend</text>
  <text x="1185" y="281" text-anchor="middle" class="small">Window aplikasi, menu, installer, dan akses file lokal</text>

  <rect x="875" y="370" width="620" height="125" rx="12" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="1185" y="402" text-anchor="middle" class="box-title">Electron Main Process</text>
  <text x="1185" y="428" text-anchor="middle" class="box-text">Menjalankan dan mengatur proses backend</text>
  <text x="1185" y="451" text-anchor="middle" class="small">Menentukan port, environment, userData, dan lifecycle</text>
  <text x="1185" y="474" text-anchor="middle" class="small">Komunikasi frontend melalui localhost</text>

  <rect x="875" y="560" width="285" height="130" rx="12" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="1017" y="592" text-anchor="middle" class="box-title">Backend Lokal</text>
  <text x="1017" y="620" text-anchor="middle" class="box-text">FastAPI + Python</text>
  <text x="1017" y="645" text-anchor="middle" class="small">API dan logika bisnis</text>
  <text x="1017" y="666" text-anchor="middle" class="small">Proses sebagai child process</text>

  <rect x="1210" y="560" width="285" height="130" rx="12" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="1352" y="592" text-anchor="middle" class="box-title">Penyimpanan Lokal</text>
  <text x="1352" y="620" text-anchor="middle" class="box-text">userData aplikasi</text>
  <text x="1352" y="645" text-anchor="middle" class="small">SQLite, upload, log</text>
  <text x="1352" y="666" text-anchor="middle" class="small">Qdrant dan embedding</text>

  <rect x="875" y="755" width="620" height="90" rx="12" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="1185" y="787" text-anchor="middle" class="box-title">Installer Desktop</text>
  <text x="1185" y="814" text-anchor="middle" class="box-text">Electron Builder</text>
  <text x="1185" y="835" text-anchor="middle" class="small">macOS DMG, Windows NSIS, Linux AppImage</text>

  <path d="M1185 305 L1185 370" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1200" y="343" class="arrow-label">IPC / localhost</text>
  <path d="M1120 495 L1017 560" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1250 495 L1352 560" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1085" y="536" class="arrow-label">spawn process</text>
  <text x="1280" y="536" class="arrow-label">file system</text>
  <path d="M1185 690 L1185 755" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="625" y="915" width="350" height="38" rx="19" fill="#e2e8f0"/>
  <text x="800" y="940" text-anchor="middle" class="small">Komponen AI eksternal dapat digunakan pada kedua mode</text>
</svg>
