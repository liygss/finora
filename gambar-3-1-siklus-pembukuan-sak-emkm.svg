  <rect x="100" y="465" width="250" height="145" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <circle cx="132" cy="498" r="20" fill="#ea580c"/><text x="132" y="505" text-anchor="middle" class="number">5</text>
  <text x="225" y="500" text-anchor="middle" class="head">Buku Besar</text>
  <text x="225" y="535" text-anchor="middle" class="text">Agregasi per akun</text><text x="225" y="559" text-anchor="middle" class="text">Mutasi debit dan kredit</text><text x="225" y="583" text-anchor="middle" class="small">Dihitung dari jurnal detail</text>

  <rect x="430" y="465" width="250" height="145" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <circle cx="462" cy="498" r="20" fill="#ea580c"/><text x="462" y="505" text-anchor="middle" class="number">6</text>
  <text x="555" y="500" text-anchor="middle" class="head">Neraca Saldo</text>
  <text x="555" y="535" text-anchor="middle" class="text">Saldo akhir setiap akun</text><text x="555" y="559" text-anchor="middle" class="text">Total debit dan kredit</text><text x="555" y="583" text-anchor="middle" class="small">Pemeriksaan keseimbangan</text>

  <rect x="760" y="465" width="250" height="145" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <circle cx="792" cy="498" r="20" fill="#ea580c"/><text x="792" y="505" text-anchor="middle" class="number">7</text>
  <text x="885" y="500" text-anchor="middle" class="head">Perhitungan Pajak</text>
  <text x="885" y="535" text-anchor="middle" class="text">PPh Final UMKM</text><text x="885" y="559" text-anchor="middle" class="text">PPN bila diperlukan</text><text x="885" y="583" text-anchor="middle" class="small">Berdasarkan data transaksi</text>

  <rect x="1090" y="465" width="370" height="145" rx="14" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <circle cx="1122" cy="498" r="20" fill="#dc2626"/><text x="1122" y="505" text-anchor="middle" class="number">8</text>
  <text x="1275" y="500" text-anchor="middle" class="head">Laporan Keuangan</text>
  <text x="1275" y="535" text-anchor="middle" class="text">Laba rugi dan posisi keuangan</text><text x="1275" y="559" text-anchor="middle" class="text">CALK dan ringkasan laporan</text><text x="1275" y="583" text-anchor="middle" class="small">Penyajian sesuai kebutuhan SAK EMKM</text>

  <path d="M350 538 L430 538" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="368" y="523" class="label">saldo</text>
  <path d="M680 538 L760 538" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="699" y="523" class="label">analisis</text>
  <path d="M1010 538 L1090 538" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1027" y="523" class="label">output</text>

  <path d="M1275 610 L1275 670 L225 670 L225 720" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="750" y="660" text-anchor="middle" class="small">Laporan digunakan untuk evaluasi dan pengambilan keputusan usaha</text>

  <rect x="100" y="720" width="250" height="145" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="132" cy="753" r="20" fill="#7c3aed"/><text x="132" y="760" text-anchor="middle" class="number">9</text>
  <text x="225" y="755" text-anchor="middle" class="head">SPT Tahunan</text>
  <text x="225" y="790" text-anchor="middle" class="text">Formulir 1770 / 1770S</text><text x="225" y="814" text-anchor="middle" class="text">Draft dan preview</text><text x="225" y="838" text-anchor="middle" class="small">Perhitungan pajak tahunan</text>

  <rect x="430" y="720" width="250" height="145" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="462" cy="753" r="20" fill="#7c3aed"/><text x="462" y="760" text-anchor="middle" class="number">10</text>
  <text x="555" y="755" text-anchor="middle" class="head">Evaluasi Keuangan</text>
  <text x="555" y="790" text-anchor="middle" class="text">Dashboard dan metrik</text><text x="555" y="814" text-anchor="middle" class="text">Analisis kinerja usaha</text><text x="555" y="838" text-anchor="middle" class="small">Dasar pengambilan keputusan</text>

  <rect x="760" y="720" width="250" height="145" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="792" cy="753" r="20" fill="#7c3aed"/><text x="792" y="760" text-anchor="middle" class="number">11</text>
  <text x="885" y="755" text-anchor="middle" class="head">Tutup Buku</text>
  <text x="885" y="790" text-anchor="middle" class="text">Jurnal penutup</text><text x="885" y="814" text-anchor="middle" class="text">Penguncian periode</text><text x="885" y="838" text-anchor="middle" class="small">Riwayat per tahun fiskal</text>

  <rect x="1090" y="720" width="370" height="145" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <circle cx="1122" cy="753" r="20" fill="#059669"/><text x="1122" y="760" text-anchor="middle" class="number">12</text>
  <text x="1275" y="755" text-anchor="middle" class="head">Periode Berikutnya</text>
  <text x="1275" y="790" text-anchor="middle" class="text">Saldo awal periode baru</text><text x="1275" y="814" text-anchor="middle" class="text">Pencatatan transaksi kembali</text><text x="1275" y="838" text-anchor="middle" class="small">Siklus pembukuan berulang</text>

  <path d="M350 793 L430 793" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M680 793 L760 793" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1010 793 L1090 793" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="500" y="955" width="600" height="50" rx="25" fill="#e2e8f0"/>
  <text x="800" y="986" text-anchor="middle" class="small">Catatan: Buku besar dan neraca saldo merupakan hasil agregasi jurnal, bukan tabel terpisah.</text>
