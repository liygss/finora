  <path d="M350 278 L430 278" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="372" y="263" class="label">data</text>
  <path d="M680 278 L760 278" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="700" y="263" class="label">posting</text>
  <path d="M1010 278 L1090 278" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1028" y="263" class="label">adjust</text>

  <path d="M1275 350 L1275 410 L225 410 L225 465" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
