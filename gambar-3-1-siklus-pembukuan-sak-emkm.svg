<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L11,3.5 L0,7 Z" fill="#334155"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity=".22"/></filter>
    <style>
      .title{font:700 29px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 15px Arial,sans-serif;fill:#475569}.section{font:700 18px Arial,sans-serif;fill:#fff}.head{font:700 17px Arial,sans-serif;fill:#0f172a}.text{font:400 14px Arial,sans-serif;fill:#334155}.small{font:400 12px Arial,sans-serif;fill:#64748b}.label{font:600 13px Arial,sans-serif;fill:#334155}.number{font:700 18px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#f8fafc"/>
  <text x="800" y="45" text-anchor="middle" class="title">Gambar 3.1 Alur Siklus Pembukuan Keuangan Berbasis SAK EMKM pada Sistem Finora</text>
  <text x="800" y="73" text-anchor="middle" class="subtitle">Alur pengolahan data keuangan dari transaksi hingga laporan dan penutupan buku</text>

  <rect x="55" y="105" width="1490" height="820" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="105" width="1490" height="55" rx="20" fill="#1e3a8a"/><rect x="55" y="140" width="1490" height="20" fill="#1e3a8a"/>
  <text x="800" y="140" text-anchor="middle" class="section">SIKLUS PEMBUKUAN KEUANGAN FINORA</text>

  <rect x="100" y="205" width="250" height="145" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="132" cy="238" r="20" fill="#2563eb"/><text x="132" y="245" text-anchor="middle" class="number">1</text>
  <text x="225" y="240" text-anchor="middle" class="head">Setup Awal</text>
  <text x="225" y="275" text-anchor="middle" class="text">Profil perusahaan</text><text x="225" y="299" text-anchor="middle" class="text">Periode pembukuan</text><text x="225" y="323" text-anchor="middle" class="small">Chart of Accounts SAK EMKM</text>

  <rect x="430" y="205" width="250" height="145" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="462" cy="238" r="20" fill="#2563eb"/><text x="462" y="245" text-anchor="middle" class="number">2</text>
  <text x="555" y="240" text-anchor="middle" class="head">Input Transaksi</text>
  <text x="555" y="275" text-anchor="middle" class="text">Input manual</text><text x="555" y="299" text-anchor="middle" class="text">Import CSV / Excel</text><text x="555" y="323" text-anchor="middle" class="small">Upload data transaksi</text>

  <rect x="760" y="205" width="250" height="145" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <circle cx="792" cy="238" r="20" fill="#16a34a"/><text x="792" y="245" text-anchor="middle" class="number">3</text>
  <text x="885" y="240" text-anchor="middle" class="head">Jurnal Umum</text>
  <text x="885" y="275" text-anchor="middle" class="text">Tanggal dan deskripsi</text><text x="885" y="299" text-anchor="middle" class="text">Debit dan kredit</text><text x="885" y="323" text-anchor="middle" class="small">Validasi keseimbangan jurnal</text>

  <rect x="1090" y="205" width="370" height="145" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <circle cx="1122" cy="238" r="20" fill="#16a34a"/><text x="1122" y="245" text-anchor="middle" class="number">4</text>
